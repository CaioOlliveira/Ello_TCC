name: ello_mobile
description: Aplicativo mobile Ello para organizacao do cuidado de idosos.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: ^5.7.0
  file_picker: ^8.1.7
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  google_sign_in: 7.2.0
  image_picker: ^1.1.2
  mobile_scanner: ^7.4.0
  pdf: ^3.11.3
  printing: ^5.14.2
  qr_flutter: ^4.1.0
  speech_to_text: ^7.0.0
  shared_preferences: ^2.5.5
  flutter_local_notifications: 22.2.0
  flutter_timezone: ^5.1.0
  timezone: ^0.11.1
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/cora_avatar.png
