name: ello_mobile
description: Aplicativo mobile Ello para organizacao do cuidado de idosos.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: ^5.7.0
  file_picker: ^8.1.7
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  google_sign_in: 7.2.0
  image_picker: ^1.1.2
  speech_to_text: ^7.0.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/cora_avatar.png
