name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  site:
    name: Site
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Verificar arquivos estáticos
        run: |
          test -s site/index.html
          test -s site/styles.css
          test -s site/assets/ello-symbol.jpeg
          test -s site/assets/ello-wordmark.jpg

  backend:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Verificar lint
        run: npm run lint

      - name: Executar testes
        run: npm test

      - name: Compilar a API
        run: npm run build

  mobile:
    name: Flutter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.2
          cache: true

      - name: Instalar dependências
        run: flutter pub get

      - name: Analisar o código
        run: flutter analyze

      - name: Executar testes
        run: flutter test
